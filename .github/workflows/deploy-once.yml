name: One-time verified Pages deployment dispatch
# This workflow only dispatches the existing manual verification/deployment.
# Remove this file after the deployment; leave pages.yml manual-only.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-once.yml'
permissions:
  actions: write
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified Pages workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo tita-mbotho-studio/redcarpert-prototype
