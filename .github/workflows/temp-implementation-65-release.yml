name: TEMP Implementation 65 approved Pages release
# One-time deployment requested by repository owner on 19 November 2026.
# Retry 2: browser loader now uses real brand artwork instead of a deleted stock fixture.
# To be deleted after release. Permanent pages.yml stays manual-only.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-implementation-65-release.yml
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'release: run approved Implementation 65 deployment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:dist
      - name: Test production pages in Chromium
        run: |
          npm run preview -- --port 4173 > /tmp/pages-preview.log 2>&1 &
          pages_preview_pid=$!
          trap 'kill "$pages_preview_pid"' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:4173/redcarpert-prototype/ > /dev/null
          npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified main artifact
        id: deployment
        uses: actions/deploy-pages@v4
